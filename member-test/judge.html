<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>GG Judge · 指定赛事测试</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="judge.css"><script type="module" src="judge.js"></script></head><body><main class="battle-wrap"><p class="eyebrow">GG JUDGE · CLOSED MOBILE TEST</p><h1>裁判录分测试</h1><p>只供指定测试账号使用；公开排行榜和赛季积分不受影响。使用各自已获授权的GG账号及验证器登录。</p><p id="message" role="status"></p><section class="card" id="login"><h2>登录 GG 测试账号</h2><form id="login-form"><label>邮箱<input type="email" name="email" required autocomplete="username"></label><label>GG 账号密码<input type="password" name="password" required autocomplete="current-password"></label><button>登录</button></form><p><a href="index.html" target="_blank" rel="noopener">注册或找回账号 ↗</a></p></section><section class="card" id="mfa" hidden><h2>裁判双重验证</h2><p>使用验证器当前的6位代码。第一次使用需自行绑定；不要分享密钥或验证码。</p><button id="enroll">设置验证器</button><div id="setup"></div><form id="mfa-form"><label>当前验证码<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button>验证</button></form></section><section class="card"><label>指定测试赛事<select id="source"><option value="ggfull20261101">完整模拟赛 · 8人 Swiss → Top4</option><option value="unwlah3a">GG Swiss 测试 · unwlah3a</option><option value="kjhh8b0r">GG Swiss 测试 · kjhh8b0r</option></select></label><button id="check">检查权限 / 刷新缓存</button><button id="logout" hidden>退出账号</button><p id="permission">尚未登录，无法写入比分。</p><p>采用原引擎缓存，不自动消耗 Challonge API 次数。云端未启用录分或额度不足时只显示赛程，不会假装保存成功。</p></section><section id="board"></section></main></body></html>
